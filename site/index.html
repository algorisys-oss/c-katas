<script type="module">

// ── CodeMirror 6 setup (esm.sh shares @codemirror/state across all imports) ──
let cmReady = false;
let cmEditorView, cmBasicSetup, cmCpp, cmOneDark;

async function loadCodeMirror() {
    try {
        const [cmMod, cppMod, themeMod] = await Promise.all([
            import("https://esm.sh/codemirror"),
            import("https://esm.sh/@codemirror/lang-cpp"),
            import("https://esm.sh/@codemirror/theme-one-dark"),
        ]);
        cmEditorView = cmMod.EditorView;
        cmBasicSetup = cmMod.basicSetup;
        cmCpp = cppMod.cpp;
        cmOneDark = themeMod.oneDark;
        cmReady = true;
    } catch (e) {
        console.warn("CodeMirror failed to load, using fallback highlighter:", e);
    }
}

function createEditor(container, code, lang) {
    if (!cmReady) return false;
    container.innerHTML = "";
    const isC = ["c", "h", "cpp", "sh"].includes(lang);
    const extensions = [
        cmBasicSetup,
        cmOneDark,
        cmEditorView.editable.of(false),
        cmEditorView.theme({
            "&": { backgroundColor: "#282c34" },
            ".cm-gutters": { backgroundColor: "#282c34", color: "#636d83", borderRight: "1px solid #3e4451" },
            ".cm-activeLineGutter": { backgroundColor: "#2c313a" },
            ".cm-activeLine": { backgroundColor: "#2c313a44" },
            ".cm-scroller": { fontFamily: "'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace" },
        }),
    ];
    if (isC) extensions.push(cmCpp());
    new cmEditorView({
        doc: code,
        extensions,
        parent: container,
    });
    return true;
}

// Start loading CodeMirror in background
const cmLoading = loadCodeMirror();

// ── Custom C syntax highlighter (fallback for markdown code blocks) ──

// ── Simple C syntax highlighter for markdown code blocks ────────────
function highlightC(code) {
    // Tokenize and wrap with spans
    const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let result = escaped;

    // Order matters — process in a single pass to avoid double-replacing
    const tokens = [];
    const re = /\/\/[^\n]*|\/\*[\s\S]*?\*\/|#\s*(?:include|define|ifdef|ifndef|endif|if|else|elif|pragma|undef|error|warning)\b[^\n]*|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)'|\b(?:void|int|char|short|long|float|double|unsigned|signed|const|static|extern|struct|union|enum|typedef|size_t|uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|bool|_Bool|FILE|NULL)\b|\b(?:if|else|for|while|do|switch|case|default|break|continue|return|goto|sizeof|typeof)\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLuU]*\b|\b0[xX][0-9a-fA-F]+[uUlL]*\b|\b[a-zA-Z_]\w*(?=\s*\()/g;

    let parts = [];
    let lastIndex = 0;
    let match;
    const src = escaped;

    // Reset regex
    re.lastIndex = 0;
    while ((match = re.exec(src)) !== null) {
        if (match.index > lastIndex) {
            parts.push(src.slice(lastIndex, match.index));
        }
        const m = match[0];
        if (m.startsWith("//") || m.startsWith("/*")) {
            parts.push(`<span class="cmt">${m}</span>`);
        } else if (m.startsWith("#")) {
            // Split preprocessor: directive vs include path
            const incMatch = m.match(/^(#\s*include\s*)(&lt;[^&]*&gt;|"[^"]*")(.*)$/);
            if (incMatch) {
                parts.push(`<span class="prep">${incMatch[1]}</span><span class="inc">${incMatch[2]}</span>${incMatch[3]}`);
            } else {
                parts.push(`<span class="prep">${m}</span>`);
            }
        } else if (m.startsWith('"') || m.startsWith("'")) {
            parts.push(`<span class="str">${m}</span>`);
        } else if (/^(?:void|int|char|short|long|float|double|unsigned|signed|const|static|extern|struct|union|enum|typedef|size_t|uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|bool|_Bool|FILE|NULL)$/.test(m)) {
            parts.push(`<span class="type">${m}</span>`);
        } else if (/^(?:if|else|for|while|do|switch|case|default|break|continue|return|goto|sizeof|typeof)$/.test(m)) {
            parts.push(`<span class="kw">${m}</span>`);
        } else if (/^\d|^0[xX]/.test(m)) {
            parts.push(`<span class="num">${m}</span>`);
        } else if (/\($/.test(src.slice(match.index, match.index + m.length + 5))) {
            // Function call
            parts.push(`<span class="func">${m}</span>`);
        } else {
            parts.push(m);
        }
        lastIndex = match.index + m.length;
    }
    if (lastIndex < src.length) {
        parts.push(src.slice(lastIndex));
    }
    return parts.join("");
}

function highlightCodeBlock(code, lang) {
    const isC = ["c", "h", "cpp"].includes(lang);
    const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    let highlighted;
    if (isC) {
        highlighted = highlightC(code);
    } else {
        highlighted = escaped;
    }

    // Add line numbers
    const lines = highlighted.split("\n");
    // Remove trailing empty line
    if (lines[lines.length - 1] === "") lines.pop();
    const numberedLines = lines.map(line => `<span class="code-line">${line}</span>`).join("\n");

    const badge = lang ? `<span class="code-lang-badge">${lang}</span>` : "";
    return `<pre>${badge}<code class="line-numbers">${numberedLines}</code></pre>`;
}

    { id: "10-function-pointers-callbacks", dir: "10-function-pointers-callbacks", title: "Function Pointers & Callbacks", phase: 3 },

// Check which modules have content
async function checkAvailableModules() {
    const checks = MODULES.map(async (mod) => {
        try {
            const res = await fetch(`../${mod.dir}/README.md`, { method: "HEAD" });
            if (res.ok) state.availableModules.add(mod.id);

// Render sidebar
function renderSidebar(filter = "") {
    const container = document.getElementById("sidebarContent");
    const filterLower = filter.toLowerCase();

    const phases = new Map();
    for (const mod of MODULES) {
        if (filter && !mod.title.toLowerCase().includes(filterLower) && !mod.id.includes(filterLower)) {
            continue;
        }
        if (!phases.has(mod.phase)) {
            phases.set(mod.phase, { name: mod.phaseName || "", modules: [] });
        }
        phases.get(mod.phase).modules.push(mod);
    }

    // Get or fill in phase names
    const phaseNames = { 1: "How Computers Work & C Basics", 2: "Pointers & Memory", 3: "Data Structures & Algorithms", 4: "Systems Building Blocks", 5: "Building Real Systems", 6: "Advanced Topics & Capstone" };

    let html = "";
    for (const [phaseNum, data] of phases) {
        if (data.modules.length === 0) continue;
        const phaseName = data.name || phaseNames[phaseNum] || `Phase ${phaseNum}`;
        html += `<div class="phase-group">
            <div class="phase-header" data-phase="${phaseNum}">
                <span class="chevron">&#9660;</span>
                Phase ${phaseNum}: ${phaseName}
            </div>
            <div class="phase-modules" data-phase-modules="${phaseNum}">`;

        for (const mod of data.modules) {
            const isActive = state.currentModule === mod.id;
            const isCompleted = state.completed.has(mod.id);
            const isAvailable = state.availableModules.has(mod.id);
            const statusClass = isCompleted ? "completed" : isAvailable ? "available" : "";
            html += `<a class="module-link${isActive ? " active" : ""}" data-id="${mod.id}">
                <span class="status ${statusClass}"></span>
                <span class="module-number">${mod.id.match(/^[\d]+[a-z]?/)[0]}</span>
                <span class="module-title">${mod.title}</span>
            </a>`;
        }
        html += `</div></div>`;
    }

    container.innerHTML = html;

    // Phase collapse handlers
    container.querySelectorAll(".phase-header").forEach((header) => {
        const phase = header.dataset.phase;
        const modules = container.querySelector(`[data-phase-modules="${phase}"]`);
        // Set natural max-height
        modules.style.maxHeight = modules.scrollHeight + "px";

        header.addEventListener("click", () => {
            header.classList.toggle("collapsed");
            modules.classList.toggle("collapsed");
            if (!modules.classList.contains("collapsed")) {
                modules.style.maxHeight = modules.scrollHeight + "px";
            }
        });
    });

    // Module click handlers
    container.querySelectorAll(".module-link").forEach((link) => {
        link.addEventListener("click", (e) => {
            e.preventDefault();
            navigateTo(link.dataset.id);
        });
    });
}

// Parse basic markdown to HTML
function parseMarkdown(md) {
    let html = md;

    // Code blocks (``` ... ```) — with syntax highlighting
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return highlightCodeBlock(code, lang || "text");
    });

    // Process line by line for block elements
    const lines = html.split("\n");
    let result = [];
    let inList = false;
    let listType = "";
    let listDepth = 0;
    let inTable = false;
    let tableRows = [];
    let inBlockquote = false;
    let blockquoteLines = [];
    let inPre = false;
    let inParagraph = false;
    let paragraphLines = [];

    function closeParagraph() {
        if (inParagraph && paragraphLines.length > 0) {
            result.push(`<p>${paragraphLines.join(" ")}</p>`);
            paragraphLines = [];
            inParagraph = false;
        }
    }

    function closeList() {
        if (inList) {
            for (let i = 0; i < listDepth; i++) {
                result.push(listType === "ol" ? "</ol>" : "</ul>");
            }
            inList = false;
            listDepth = 0;
        }
    }

    function closeTable() {
        if (inTable && tableRows.length > 0) {
            let tableHtml = "<table><thead><tr>";
            const headers = tableRows[0];
            for (const h of headers) {
                tableHtml += `<th>${inlineFormat(h.trim())}</th>`;
            }
            tableHtml += "</tr></thead><tbody>";
            for (let i = 2; i < tableRows.length; i++) {
                tableHtml += "<tr>";
                for (const cell of tableRows[i]) {
                    tableHtml += `<td>${inlineFormat(cell.trim())}</td>`;
                }
                tableHtml += "</tr>";
            }
            tableHtml += "</tbody></table>";
            result.push(tableHtml);
            tableRows = [];
            inTable = false;
        }
    }

    function closeBlockquote() {
        if (inBlockquote && blockquoteLines.length > 0) {
            result.push(`<blockquote><p>${blockquoteLines.join(" ")}</p></blockquote>`);
            blockquoteLines = [];
            inBlockquote = false;
        }
    }

    function inlineFormat(text) {
        // Bold+italic
        text = text.replace(/\*\*\*(.*?)\*\*\*/g, "<strong><em>$1</em></strong>");
        // Bold
        text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        // Italic
        text = text.replace(/\*(.*?)\*/g, "<em>$1</em>");
        // Inline code
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Links
        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        return text;
    }

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Track pre blocks — skip all lines inside <pre>...</pre>
        if (line.includes("<pre>") || line.includes("<pre ")) {
            closeParagraph();
            closeList();
            closeTable();
            closeBlockquote();
            inPre = true;
            result.push(line);
            // If </pre> is on the same line, close immediately
            if (line.includes("</pre>")) inPre = false;
            continue;
        }
        if (inPre) {
            result.push(line);
            if (line.includes("</pre>")) inPre = false;
            continue;
        }

        // Headings
        const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
            closeParagraph();
            closeList();
            closeTable();
            closeBlockquote();
            const level = headingMatch[1].length;
            result.push(`<h${level}>${inlineFormat(headingMatch[2])}</h${level}>`);
            continue;
        }

        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
            closeParagraph();
            closeList();
            closeTable();
            closeBlockquote();
            result.push("<hr>");
            continue;
        }

        // Table row
        if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
            closeParagraph();
            closeList();
            closeBlockquote();
            inTable = true;
            const cells = line.trim().slice(1, -1).split("|");
            tableRows.push(cells);
            continue;
        } else if (inTable) {
            closeTable();
        }

        // Blockquote
        if (line.startsWith("> ")) {
            closeParagraph();
            closeList();
            closeTable();
            inBlockquote = true;
            blockquoteLines.push(inlineFormat(line.slice(2)));
            continue;
        } else if (inBlockquote) {
            closeBlockquote();
        }

        // Unordered list
        const ulMatch = line.match(/^(\s*)[-*]\s+(.*)$/);
        if (ulMatch) {
            closeParagraph();
            closeTable();
            closeBlockquote();
            const indent = Math.floor(ulMatch[1].length / 2) + 1;
            if (!inList) {
                inList = true;
                listType = "ul";
                listDepth = 1;
                result.push("<ul>");
            }
            while (indent > listDepth) {
                result.push("<ul>");
                listDepth++;
            }
            while (indent < listDepth) {
                result.push("</ul>");
                listDepth--;
            }
            result.push(`<li>${inlineFormat(ulMatch[2])}</li>`);
            continue;
        }

        // Ordered list
        const olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);
        if (olMatch) {
            closeParagraph();
            closeTable();
            closeBlockquote();
            if (!inList) {
                inList = true;
                listType = "ol";
                listDepth = 1;
                result.push("<ol>");
            }
            result.push(`<li>${inlineFormat(olMatch[2])}</li>`);
            continue;
        }

        // Close list if we hit a non-list line
        if (inList && !ulMatch && !olMatch) {
            closeList();
        }

        // Empty line
        if (line.trim() === "") {
            closeParagraph();
            continue;
        }

        // Regular paragraph text
        inParagraph = true;
        paragraphLines.push(inlineFormat(line));
    }

    closeParagraph();
    closeList();
    closeTable();
    closeBlockquote();

    return result.join("\n");
}

// Fetch and display a module
async function loadModule(moduleId) {
    const mod = MODULES.find((m) => m.id === moduleId);
    if (!mod) {
        showError(`Module ${moduleId} not found.`);
        return;
    }

    const content = document.getElementById("mainContent");

    if (!state.availableModules.has(moduleId)) {
        content.innerHTML = `
            <div class="markdown-body">
                <h1>${mod.id} — ${mod.title}</h1>
                <div class="error-msg">
                    This module hasn't been built yet. It's coming soon!
                </div>
                ${renderNav(moduleId)}
            </div>`;
        return;
    }

    content.innerHTML = `<div class="loading">Loading lesson...</div>`;

    try {
        let readme;
        if (state.readmeCache.has(moduleId)) {
            readme = state.readmeCache.get(moduleId);
        } else {
            const res = await fetch(`../${mod.dir}/README.md`);
            if (!res.ok) throw new Error(`Failed to load: ${res.status}`);
            readme = await res.text();
            state.readmeCache.set(moduleId, readme);
        }

        const htmlContent = parseMarkdown(readme);

        // Try to load exercise and solution files
        let filesHtml = "";
        const exerciseFiles = await fetchFileList(mod.dir, "exercises");
        const solutionFiles = await fetchFileList(mod.dir, "solutions");

        if (exerciseFiles.length > 0) {
            filesHtml += await renderFileTabs("Exercises", exerciseFiles, mod.dir, "exercises");
        }
        if (solutionFiles.length > 0) {
            filesHtml += await renderFileTabs("Solutions", solutionFiles, mod.dir, "solutions");
        }

        // Completion toggle
        const isCompleted = state.completed.has(moduleId);
        const toggleHtml = `
            <div style="margin-top: 32px; display: flex; align-items: center; gap: 12px;">
                <button id="completeToggle" style="
                    padding: 8px 20px;
                    background: ${isCompleted ? "var(--green)" : "var(--bg-tertiary)"};
                    border: 1px solid ${isCompleted ? "var(--green)" : "var(--border)"};
                    border-radius: 6px;
                    color: var(--text);
                    cursor: pointer;
                    font-size: 14px;
                    transition: all 0.15s ease;
                ">${isCompleted ? "&#10003; Completed" : "Mark as Complete"}</button>
            </div>`;

        content.innerHTML = `
            <div class="markdown-body">
                ${htmlContent}
            </div>
            ${filesHtml}
            ${toggleHtml}
            ${renderNav(moduleId)}`;

        // Completion toggle handler
        document.getElementById("completeToggle")?.addEventListener("click", () => {
            if (state.completed.has(moduleId)) {
                state.completed.delete(moduleId);
            } else {
                state.completed.add(moduleId);
            }
            saveCompleted();
            updateProgress();
            renderSidebar(document.getElementById("searchInput").value);
            loadModule(moduleId); // re-render
        });

        // Initialize CodeMirror editors for file viewers
        await initFileEditors();

        // File tab handlers
        content.querySelectorAll(".file-tab").forEach((tab) => {
            tab.addEventListener("click", () => {
                const group = tab.closest(".file-viewer-group");
                group.querySelectorAll(".file-tab").forEach((t) => t.classList.remove("active"));
                group.querySelectorAll(".file-pane").forEach((p) => (p.style.display = "none"));
                tab.classList.add("active");
                const pane = group.querySelector(`.file-pane[data-file="${tab.dataset.file}"]`);
                if (pane) pane.style.display = "block";
                // Refresh CodeMirror when tab becomes visible
                const cm = pane.querySelector(".cm-editor");
                if (cm && cm.cmView) cm.cmView.view.requestMeasure();
            });
        });

    } catch (err) {
        content.innerHTML = `<div class="error-msg">Failed to load module: ${err.message}</div>`;
    }
}

async function renderFileTabs(label, files, dir, subdir) {
    if (files.length === 0) return "";

    // Fetch all file contents in parallel
    const contents = await Promise.all(
        files.map(async (name) => {
            const key = `${dir}/${subdir}/${name}`;
            if (state.fileCache.has(key)) return { name, content: state.fileCache.get(key) };
            try {
                const res = await fetch(`../${dir}/${subdir}/${name}`);
                const text = await res.text();
                state.fileCache.set(key, text);
                return { name, content: text };
            } catch {
                return { name, content: "// Failed to load file" };
            }
        })
    );

    // Store contents for syntax-highlighted rendering
    state._pendingEditors = state._pendingEditors || [];

    let tabs = `<h3>${label}</h3><div class="file-viewer-group"><div class="file-tabs">`;
    for (let i = 0; i < contents.length; i++) {
        tabs += `<button class="file-tab${i === 0 ? " active" : ""}" data-file="${contents[i].name}">${contents[i].name}</button>`;
    }
    tabs += `</div>`;

    for (let i = 0; i < contents.length; i++) {
        const editorId = `editor-${subdir}-${contents[i].name}`.replace(/[^a-zA-Z0-9-]/g, "_");
        tabs += `<div class="file-content file-pane" data-file="${contents[i].name}" id="${editorId}" style="display: ${i === 0 ? "block" : "none"}">
            <pre><code>Loading...</code></pre>
        </div>`;
        state._pendingEditors.push({ id: editorId, code: contents[i].content, name: contents[i].name });
    }
    tabs += `</div>`;
    return tabs;
}

async function initFileEditors() {
    await cmLoading;
    const pending = state._pendingEditors || [];
    state._pendingEditors = [];

    for (const { id, code, name } of pending) {
        const container = document.getElementById(id);
        if (!container) continue;

        const ext = name.split(".").pop();
        if (cmReady) {
            createEditor(container, code, ext);
        } else {
            // Fallback: custom syntax highlighter
            const isC = ["c", "h"].includes(ext);
            const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const highlighted = isC ? highlightC(code) : escaped;
            const lines = highlighted.split("\n");
            if (lines[lines.length - 1] === "") lines.pop();
            const numbered = lines.map(l => `<span class="code-line">${l}</span>`).join("\n");
            container.innerHTML = `<pre><code class="line-numbers">${numbered}</code></pre>`;
        }
    }
}

function renderNav(moduleId) {
    const idx = MODULES.findIndex((m) => m.id === moduleId);
    const prev = idx > 0 ? MODULES[idx - 1] : null;
    const next = idx < MODULES.length - 1 ? MODULES[idx + 1] : null;

    return `<div class="lesson-nav">
        <a class="lesson-nav-btn${prev ? "" : " disabled"}" ${prev ? `data-nav="${prev.id}"` : ""}>
            <span>&#8592;</span>
            <div>
                <div class="nav-label">Previous</div>
                <div class="nav-title">${prev ? `${prev.id} — ${prev.title}` : ""}</div>
            </div>
        </a>
        <a class="lesson-nav-btn${next ? "" : " disabled"}" ${next ? `data-nav="${next.id}"` : ""}>
            <div style="text-align: right">
                <div class="nav-label">Next</div>
                <div class="nav-title">${next ? `${next.id} — ${next.title}` : ""}</div>
            </div>
            <span>&#8594;</span>
        </a>
    </div>`;
}

function showWelcome() {
    const totalModules = MODULES.length;
    const completedCount = state.completed.size;
    const availableCount = state.availableModules.size;

    document.getElementById("mainContent").innerHTML = `
        <div class="welcome">
            <h2>C Systems Programming</h2>
            <p>From first principles. 30 modules. Build real systems. No shortcuts.</p>
            <button class="start-btn" id="startBtn">Start Learning</button>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">${totalModules}</div>
                    <div class="stat-label">Total Modules</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${availableCount}</div>
                    <div class="stat-label">Available</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${completedCount}</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">6</div>
                    <div class="stat-label">Phases</div>
                </div>
            </div>
        </div>`;

    document.getElementById("startBtn").addEventListener("click", () => {
        navigateTo("00-how-computers-work");
    });
}

function showError(msg) {
    document.getElementById("mainContent").innerHTML = `<div class="error-msg">${msg}</div>`;
}

function updateProgress() {
    const total = MODULES.length;
    const done = state.completed.size;
    const pct = total > 0 ? (done / total) * 100 : 0;
    document.getElementById("progressFill").style.width = `${pct}%`;
    document.getElementById("progressText").textContent = `${done} / ${total}`;
}

function navigateTo(moduleId) {
    if (moduleId === null) {
        window.location.hash = "";
        state.currentModule = null;
        showWelcome();
    } else {
        window.location.hash = moduleId;
        state.currentModule = moduleId;
        loadModule(moduleId);
    }
    renderSidebar(document.getElementById("searchInput").value);

    // Close mobile sidebar
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("visible");
}

// Event delegation for nav buttons
document.getElementById("mainContent").addEventListener("click", (e) => {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
        e.preventDefault();
        navigateTo(navBtn.dataset.nav);
    }
});

// Search
document.getElementById("searchInput").addEventListener("input", (e) => {
    renderSidebar(e.target.value);
});

// Mobile menu
document.getElementById("menuToggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("visible");
});
document.getElementById("sidebarOverlay").addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("visible");
});

// Hash navigation
window.addEventListener("hashchange", () => {
    const hash = window.location.hash.slice(1);
    if (hash) {
        state.currentModule = hash;
        loadModule(hash);
        renderSidebar(document.getElementById("searchInput").value);
    } else {
        state.currentModule = null;
        showWelcome();
        renderSidebar("");
    }
});

// Init
async function init() {
    await checkAvailableModules();
    updateProgress();
    renderSidebar();

    const hash = window.location.hash.slice(1);
    if (hash && MODULES.find((m) => m.id === hash)) {
        state.currentModule = hash;
        loadModule(hash);
    } else {
        showWelcome();
    }
}

init();
